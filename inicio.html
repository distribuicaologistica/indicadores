<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Início · Tarumã</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --fundo:#eef4fb; --fundo-2:#dbe9fa; --superficie:#fff; --borda:#d6e4f4;
    --azul:#2b7fd4; --azul-forte:#1a5fa8; --azul-suave:#eaf3fd;
    --laranja:#e07b1f; --laranja-suave:#fdf1e3;
    --tinta:#0f2a45; --tinta-fraca:#65809c;
    --raio:14px;
    --sombra:0 1px 2px rgba(15,42,69,.04), 0 14px 32px -20px rgba(15,42,69,.26);
    --display:"Sora",system-ui,sans-serif;
    --corpo:"Plus Jakarta Sans",system-ui,sans-serif;
    --mono:"JetBrains Mono",ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;font-family:var(--corpo);color:var(--tinta);
    background:var(--fundo);
    background-image:radial-gradient(80% 40% at 60% 0%, #fff 0%, var(--fundo) 55%, var(--fundo-2) 100%);
    display:flex;
  }
  [hidden]{display:none !important}

  /* ---------------- menu lateral ---------------- */
  .lateral{
    width:246px;flex:none;background:var(--superficie);border-right:1px solid var(--borda);
    padding:22px 16px;display:flex;flex-direction:column;gap:3px;
    position:sticky;top:0;height:100vh;overflow-y:auto;
  }
  .logo{display:flex;align-items:center;gap:11px;padding:0 8px 18px;margin-bottom:6px;border-bottom:1px solid var(--borda)}
  .logo .simbolo{width:38px;height:38px;border-radius:11px;flex:none;background:var(--azul-suave);
    border:1px solid var(--borda);display:flex;align-items:center;justify-content:center}
  .logo svg{width:19px;height:19px;stroke:var(--azul);fill:none;stroke-width:1.9}
  .logo b{font-family:var(--display);font-size:15px;display:block;letter-spacing:-.01em}
  .logo span{font-size:11px;color:var(--tinta-fraca)}

  .nav-titulo{
    display:flex;align-items:center;gap:8px;
    font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
    color:var(--tinta-fraca);padding:16px 10px 7px;
  }
  .nav-titulo::after{content:"";flex:1;height:1px;background:var(--borda)}
  .nav-titulo.risco{color:var(--laranja)}
  .nav-titulo.risco::after{background:var(--laranja-suave)}

  .item{
    display:flex;align-items:center;gap:10px;width:100%;
    font-family:var(--corpo);font-size:14px;font-weight:500;
    color:var(--tinta-fraca);text-align:left;
    background:none;border:0;border-radius:10px;
    padding:11px 12px;cursor:pointer;transition:.14s;line-height:1.35;
  }
  .item:hover{background:var(--azul-suave);color:var(--azul-forte)}
  .item.ativo{background:var(--azul);color:#fff;font-weight:600}
  .item:focus-visible{outline:2px solid var(--azul);outline-offset:2px}
  .item .ponto{width:6px;height:6px;border-radius:50%;flex:none;background:var(--borda)}
  .item:hover .ponto{background:var(--azul)}
  .item.ativo .ponto{background:#fff}
  .item.risco .ponto{background:var(--laranja)}
  .item.risco:hover{background:var(--laranja-suave);color:var(--laranja)}
  .item.risco.ativo{background:var(--laranja);color:#fff}
  .item.risco.ativo .ponto{background:#fff}

  .rodape-lateral{margin-top:auto;padding-top:16px;border-top:1px solid var(--borda);
    font-size:12px;color:var(--tinta-fraca)}
  .rodape-lateral b{display:block;color:var(--tinta);font-size:13px;margin-bottom:2px}
  .rodape-lateral a,.rodape-lateral button{display:block;width:100%;text-align:left;margin-top:8px;
    font-family:var(--corpo);font-size:12px;font-weight:600;color:var(--tinta-fraca);
    text-decoration:none;background:none;border:0;padding:6px 0;cursor:pointer}
  .rodape-lateral a:hover,.rodape-lateral button:hover{color:var(--azul)}

  /* ---------------- conteúdo ---------------- */
  .conteudo{flex:1;min-width:0;padding:30px 34px 60px}
  h1{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:-.02em;margin:0}
  .sub{font-size:13.5px;color:var(--tinta-fraca);margin:6px 0 26px;line-height:1.6}

  .cartao{background:var(--superficie);border:1px solid var(--borda);border-radius:var(--raio);
    padding:26px 28px;box-shadow:var(--sombra);margin-bottom:18px}
  .cartao h2{font-family:var(--display);font-weight:600;font-size:16px;margin:0 0 14px}
  .cartao p{line-height:1.7;margin:0 0 12px}
  .cartao p:last-child{margin-bottom:0}
  .cartao ul{line-height:1.9;padding-left:20px;margin:0}

  .capa{
    background:linear-gradient(120deg, var(--azul-forte) 0%, var(--azul) 55%, #5aa6e6 100%);
    color:#fff;border:0;padding:32px;margin-bottom:26px;
  }
  .capa h1{color:#fff;font-size:26px}
  .capa .sub{color:rgba(255,255,255,.86);margin:8px 0 0}

  .titulo-secao{font-family:var(--display);font-weight:600;font-size:13px;
    letter-spacing:.06em;text-transform:uppercase;color:var(--tinta-fraca);margin:0 0 14px}

  .atalhos{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:14px;margin-bottom:28px}
  .atalho{
    position:relative;overflow:hidden;
    background:var(--superficie);border:1px solid var(--borda);border-radius:12px;
    padding:20px;cursor:pointer;text-align:left;font-family:var(--corpo);
    box-shadow:var(--sombra);transition:.16s;
  }
  .atalho::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--azul);opacity:0;transition:.16s}
  .atalho:hover{transform:translateY(-2px);border-color:#bcd6ef}
  .atalho:hover::before{opacity:1}
  .atalho.risco::before{background:var(--laranja)}
  .atalho b{display:block;font-size:14.5px;font-weight:600;margin-bottom:5px}
  .atalho span{font-size:12.5px;color:var(--tinta-fraca);line-height:1.55}
  .atalho:focus-visible{outline:2px solid var(--azul);outline-offset:2px}

  .em-breve{display:inline-block;font-family:var(--mono);font-size:10px;font-weight:600;
    letter-spacing:.06em;text-transform:uppercase;color:var(--azul-forte);
    background:var(--azul-suave);border-radius:20px;padding:4px 11px;margin-bottom:14px}

  @media (max-width:860px){
    body{flex-direction:column}
    .lateral{width:100%;height:auto;position:static;overflow:visible}
    .conteudo{padding:22px 16px 50px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>

<aside class="lateral">
  <div class="logo">
    <div class="simbolo" aria-hidden="true">
      <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 16V7h11v9M14 10h4l3 3.5V16"/>
        <circle cx="7" cy="17.5" r="1.9"/><circle cx="17.5" cy="17.5" r="1.9"/>
      </svg>
    </div>
    <div><b>Tarumã</b><span>Portal do colaborador</span></div>
  </div>

  <button class="item" data-ir="inicio"><span class="ponto"></span>Início</button>

  <nav id="menu"></nav>

  <div class="rodape-lateral">
    <b id="quem">—</b>
    <span id="cargo"></span>
    <a href="./admin.html" id="link-admin" hidden>Administração</a>
    <button id="sair">Sair</button>
  </div>
</aside>

<main class="conteudo" id="conteudo"></main>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

/* ================= CONFIGURAÇÃO ================= */
const SUPABASE_URL      = "https://nquoksknvkahnfvqvcoo.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_u0e1CVU5F7PTGdQ0U2Mx8g_wPRXUHhh";
const TELA_LOGIN  = "./login.html";
const TELA_PAINEL = "./painel.html";
/* ================================================ */

/* ==================================================================
   MENU E CONTEÚDO
   Para publicar uma seção, troque o "html" dela pelo conteúdo real.
   Cada bloco de texto vai dentro de <div class="cartao">.
   ================================================================== */
const GRUPOS = [
  {
    titulo: "Áreas",
    itens: [
      { id: "indicadores", rotulo: "Indicadores", link: TELA_PAINEL,
        resumo: "Devolução, dispersão, refugo e rating" },
      { id: "sonho",        rotulo: "Sonho",           resumo: "O sonho da Tarumã",        html: null },
      { id: "5s",           rotulo: "5S",              resumo: "Programa 5S",              html: null },
      { id: "rota",         rotulo: "Rota - Processos", resumo: "Processos de rota",       html: null },
      { id: "lups",         rotulo: "LUPs",            resumo: "Lições de um ponto",       html: null },
      { id: "treinamentos", rotulo: "Treinamentos",    resumo: "Capacitações e reciclagens", html: null },
      { id: "ouvidoria",    rotulo: "Ouvidoria",       resumo: "Canal de escuta",          html: null }
    ]
  },
  {
    titulo: "Segurança",
    destaque: true,
    itens: [
      { id: "abono",            rotulo: "Abono de Registros Telemetria", resumo: "Justificativa de registros",       html: null },
      { id: "relato-seguranca", rotulo: "Relato de Segurança",           resumo: "Registro de condição insegura",    html: null },
      { id: "relato-positivo",  rotulo: "Relato Positivo",               resumo: "Reconhecimento de boa prática",    html: null }
    ]
  }
];

const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = (id) => document.getElementById(id);
let perfil = null;

const escapar = (t) => String(t ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

const todosItens = () => GRUPOS.flatMap((g) =>
  g.itens.map((i) => ({ ...i, risco: !!g.destaque })));

/* ---------- menu ---------- */
function montarMenu(){
  $("menu").innerHTML = GRUPOS.map((g) => `
    <div class="nav-titulo ${g.destaque ? "risco" : ""}">${escapar(g.titulo)}</div>
    ${g.itens.map((i) => `
      <button class="item ${g.destaque ? "risco" : ""}" data-ir="${i.id}">
        <span class="ponto"></span>${escapar(i.rotulo)}
      </button>`).join("")}
  `).join("");

  document.querySelectorAll("[data-ir]").forEach((b) =>
    b.addEventListener("click", () => abrir(b.dataset.ir)));
}

function marcar(id){
  document.querySelectorAll("[data-ir]").forEach((b) =>
    b.classList.toggle("ativo", b.dataset.ir === id));
}

/* ---------- conteúdo ---------- */
function abrir(id){
  if (id === "inicio") return verInicio();

  const item = todosItens().find((s) => s.id === id);
  if (!item) return verInicio();
  if (item.link){ window.location.href = item.link; return; }

  marcar(id);
  history.replaceState(null, "", "#" + id);

  $("conteudo").innerHTML = `
    <h1>${escapar(item.rotulo)}</h1>
    <p class="sub">${escapar(item.resumo || "")}</p>
    ${item.html ?? `
      <div class="cartao">
        <span class="em-breve">Em preparação</span>
        <h2>Conteúdo ainda não publicado</h2>
        <p>Esta seção já aparece no menu, mas o conteúdo ainda vai ser cadastrado.</p>
      </div>`}`;

  window.scrollTo({ top: 0 });
}

function verInicio(){
  marcar("inicio");
  history.replaceState(null, "", location.pathname);

  const hora = new Date().getHours();
  const saudacao = hora < 12 ? "Bom dia" : hora < 18 ? "Boa tarde" : "Boa noite";

  $("conteudo").innerHTML = `
    <div class="cartao capa">
      <h1>${saudacao}, ${escapar(perfil.nome.split(" ")[0])}</h1>
      <p class="sub">Escolha uma área no menu ao lado ou nos atalhos abaixo.</p>
    </div>
    ${GRUPOS.map((g) => `
      <h2 class="titulo-secao">${escapar(g.titulo)}</h2>
      <div class="atalhos">
        ${g.itens.map((i) => `
          <button class="atalho ${g.destaque ? "risco" : ""}" data-atalho="${i.id}">
            <b>${escapar(i.rotulo)}</b>
            <span>${escapar(i.resumo || "")}</span>
          </button>`).join("")}
      </div>`).join("")}`;

  $("conteudo").querySelectorAll("[data-atalho]").forEach((b) =>
    b.addEventListener("click", () => abrir(b.dataset.atalho)));
}

$("sair").addEventListener("click", async () => {
  await sb.auth.signOut();
  window.location.replace(TELA_LOGIN);
});

/* ---------- entrada ---------- */
(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (!session){ window.location.replace(TELA_LOGIN); return; }

  const { data } = await sb.from("perfis")
    .select("nome, setor, papel, ativo, senha_provisoria")
    .eq("id", session.user.id).maybeSingle();

  if (!data || !data.ativo){ await sb.auth.signOut(); window.location.replace(TELA_LOGIN); return; }
  if (data.senha_provisoria){ window.location.replace(TELA_LOGIN); return; }

  perfil = data;
  $("quem").textContent = perfil.nome.split(" ")[0];
  $("cargo").textContent = perfil.setor || "Tarumã";
  if (perfil.papel === "admin") $("link-admin").hidden = false;

  montarMenu();

  const alvo = location.hash.replace("#", "");
  if (alvo && todosItens().some((s) => s.id === alvo)) abrir(alvo);
  else verInicio();
})();
</script>
</body>
</html>
