<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Início · Tarumã</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --fundo:#eef4fb; --fundo-2:#dbe9fa; --superficie:#fff; --borda:#d6e4f4;
    --azul:#2b7fd4; --azul-forte:#1a5fa8; --azul-suave:#eaf3fd;
    --laranja:#e07b1f; --laranja-suave:#fdf1e3;
    --tinta:#0f2a45; --tinta-fraca:#65809c;
    --raio:14px;
    --sombra:0 1px 2px rgba(15,42,69,.04), 0 14px 32px -20px rgba(15,42,69,.26);
    --display:"Sora",system-ui,sans-serif;
    --corpo:"Plus Jakarta Sans",system-ui,sans-serif;
    --mono:"JetBrains Mono",ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;font-family:var(--corpo);color:var(--tinta);
    background:var(--fundo);
    background-image:radial-gradient(80% 40% at 60% 0%, #fff 0%, var(--fundo) 55%, var(--fundo-2) 100%);
    display:flex;
  }
  [hidden]{display:none !important}

  /* ---------------- menu lateral ---------------- */
  .lateral{
    width:246px;flex:none;background:var(--superficie);border-right:1px solid var(--borda);
    padding:22px 16px;display:flex;flex-direction:column;gap:3px;
    position:sticky;top:0;height:100vh;overflow-y:auto;
  }
  .logo{display:flex;align-items:center;gap:11px;padding:0 8px 18px;margin-bottom:6px;border-bottom:1px solid var(--borda)}
  .logo .simbolo{width:38px;height:38px;border-radius:11px;flex:none;background:var(--azul-suave);
    border:1px solid var(--borda);display:flex;align-items:center;justify-content:center}
  .logo svg{width:19px;height:19px;stroke:var(--azul);fill:none;stroke-width:1.9}
  .logo b{font-family:var(--display);font-size:15px;display:block;letter-spacing:-.01em}
  .logo span{font-size:11px;color:var(--tinta-fraca)}

  .nav-titulo{
    display:flex;align-items:center;gap:8px;
    font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
    color:var(--tinta-fraca);padding:16px 10px 7px;
  }
  .nav-titulo::after{content:"";flex:1;height:1px;background:var(--borda)}
  .nav-titulo.risco{color:var(--laranja)}
  .nav-titulo.risco::after{background:var(--laranja-suave)}

  .item{
    display:flex;align-items:center;gap:10px;width:100%;
    font-family:var(--corpo);font-size:14px;font-weight:500;
    color:var(--tinta-fraca);text-align:left;
    background:none;border:0;border-radius:10px;
    padding:11px 12px;cursor:pointer;transition:.14s;line-height:1.35;
  }
  .item:hover{background:var(--azul-suave);color:var(--azul-forte)}
  .item.ativo{background:var(--azul);color:#fff;font-weight:600}
  .item:focus-visible{outline:2px solid var(--azul);outline-offset:2px}
  .item .ponto{width:6px;height:6px;border-radius:50%;flex:none;background:var(--borda)}
  .item:hover .ponto{background:var(--azul)}
  .item.ativo .ponto{background:#fff}
  .item.risco .ponto{background:var(--laranja)}
  .item.risco:hover{background:var(--laranja-suave);color:var(--laranja)}
  .item.risco.ativo{background:var(--laranja);color:#fff}
  .item.risco.ativo .ponto{background:#fff}

  .rodape-lateral{margin-top:auto;padding-top:16px;border-top:1px solid var(--borda);
    font-size:12px;color:var(--tinta-fraca)}
  .rodape-lateral b{display:block;color:var(--tinta);font-size:13px;margin-bottom:2px}
  .rodape-lateral a,.rodape-lateral button{display:block;width:100%;text-align:left;margin-top:8px;
    font-family:var(--corpo);font-size:12px;font-weight:600;color:var(--tinta-fraca);
    text-decoration:none;background:none;border:0;padding:6px 0;cursor:pointer}
  .rodape-lateral a:hover,.rodape-lateral button:hover{color:var(--azul)}

  /* ---------------- conteúdo ---------------- */
  .conteudo{flex:1;min-width:0;padding:30px 34px 60px}
  h1{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:-.02em;margin:0}
  .sub{font-size:13.5px;color:var(--tinta-fraca);margin:6px 0 26px;line-height:1.6}

  .cartao{background:var(--superficie);border:1px solid var(--borda);border-radius:var(--raio);
    padding:26px 28px;box-shadow:var(--sombra);margin-bottom:18px}
  .cartao h2{font-family:var(--display);font-weight:600;font-size:16px;margin:0 0 14px}
  .cartao p{line-height:1.7;margin:0 0 12px}
  .cartao p:last-child{margin-bottom:0}
  .cartao ul{line-height:1.9;padding-left:20px;margin:0}

  .capa{
    background:linear-gradient(120deg, var(--azul-forte) 0%, var(--azul) 55%, #5aa6e6 100%);
    color:#fff;border:0;padding:32px;margin-bottom:26px;
  }
  .capa h1{color:#fff;font-size:26px}
  .capa .sub{color:rgba(255,255,255,.86);margin:8px 0 0}

  .titulo-secao{font-family:var(--display);font-weight:600;font-size:13px;
    letter-spacing:.06em;text-transform:uppercase;color:var(--tinta-fraca);margin:0 0 14px}

  .atalhos{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:14px;margin-bottom:28px}
  .atalho{
    position:relative;overflow:hidden;
    background:var(--superficie);border:1px solid var(--borda);border-radius:12px;
    padding:20px;cursor:pointer;text-align:left;font-family:var(--corpo);
    box-shadow:var(--sombra);transition:.16s;
  }
  .atalho::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--azul);opacity:0;transition:.16s}
  .atalho:hover{transform:translateY(-2px);border-color:#bcd6ef}
  .atalho:hover::before{opacity:1}
  .atalho.risco::before{background:var(--laranja)}
  .atalho b{display:block;font-size:14.5px;font-weight:600;margin-bottom:5px}
  .atalho span{font-size:12.5px;color:var(--tinta-fraca);line-height:1.55}
  .atalho:focus-visible{outline:2px solid var(--azul);outline-offset:2px}

  /* ---- componentes para as páginas de conteúdo ---- */
  .destaque{
    background:linear-gradient(120deg, var(--azul-forte), var(--azul) 70%, #5aa6e6);
    color:#fff;border:0;
  }
  .destaque h2{color:#fff;font-size:19px}
  .destaque p{font-size:16px;line-height:1.75;color:rgba(255,255,255,.94)}

  .frase{
    font-family:var(--display);font-weight:600;font-size:21px;line-height:1.5;
    letter-spacing:-.01em;margin:0;
  }

  .pilares{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
  .pilar{border:1px solid var(--borda);border-radius:12px;padding:20px}
  .pilar .numero{
    font-family:var(--mono);font-size:11px;font-weight:600;color:var(--azul);
    background:var(--azul-suave);border-radius:20px;padding:3px 10px;display:inline-block;margin-bottom:10px;
  }
  .pilar b{display:block;font-size:14.5px;margin-bottom:6px}
  .pilar span{font-size:13px;color:var(--tinta-fraca);line-height:1.6}

  .marcos{list-style:none;padding:0;margin:0}
  .marcos li{
    position:relative;padding:0 0 22px 26px;border-left:2px solid var(--borda);
    margin-left:6px;line-height:1.65;
  }
  .marcos li:last-child{border-left-color:transparent;padding-bottom:0}
  .marcos li::before{
    content:"";position:absolute;left:-7px;top:4px;width:12px;height:12px;
    border-radius:50%;background:var(--superficie);border:2px solid var(--azul);
  }
  .marcos b{display:block;font-family:var(--mono);font-size:11px;color:var(--azul);margin-bottom:3px}

  /* ---- sonho ---- */
  .manifesto{
    background:linear-gradient(135deg, #0b2035 0%, #12365c 55%, #1b4f80 100%);
    border:0;color:#fff;padding:38px 40px;
  }
  .manifesto .verbo{
    font-family:var(--display);font-weight:700;font-size:46px;line-height:1;
    letter-spacing:-.03em;margin:0 0 10px;
  }
  .manifesto .risca{width:74px;height:2px;background:var(--laranja);margin:0 0 20px}
  .manifesto p{font-size:17px;line-height:1.6;color:rgba(255,255,255,.9);margin:0 0 14px}
  .manifesto p:last-child{margin-bottom:0}
  .manifesto .valores{
    font-family:var(--display);font-weight:700;font-size:27px;line-height:1.25;
    letter-spacing:-.02em;color:#fff;margin:0 0 14px;
  }
  .manifesto .valores em{font-style:normal;color:#f5b04d}

  .metas{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
  .meta-cartao{
    border:1px solid var(--borda);border-left:4px solid var(--laranja);
    border-radius:12px;padding:18px 20px;
  }
  .meta-cartao .rotulo{font-size:13px;font-weight:600;color:var(--tinta-fraca);margin-bottom:10px}
  .meta-cartao .alvo{
    font-family:var(--mono);font-weight:600;font-size:25px;letter-spacing:-.02em;color:var(--tinta);
  }
  .meta-cartao .condicao{
    display:block;font-family:var(--corpo);font-size:11px;font-weight:600;
    color:var(--tinta-fraca);margin-top:8px;
  }

  /* ---- 5S ---- */
  .abertura{display:grid;grid-template-columns:300px 1fr;gap:30px;align-items:center}
  .roda{width:100%;max-width:300px;height:auto;display:block;margin:0 auto}
  .abertura .frase-5s{font-family:var(--display);font-weight:600;font-size:20px;
    line-height:1.5;letter-spacing:-.01em;margin:0 0 14px}

  .sensos{display:flex;flex-direction:column;gap:12px}
  .senso{
    display:grid;grid-template-columns:44px 1fr;gap:16px;align-items:start;
    border:1px solid var(--borda);border-radius:12px;padding:18px 20px;
    border-left-width:4px;border-left-style:solid;
  }
  .senso .marcador{
    width:34px;height:34px;border-radius:10px;display:flex;align-items:center;
    justify-content:center;font-family:var(--display);font-weight:700;font-size:16px;color:#fff;
  }
  .senso .japones{font-family:var(--display);font-weight:600;font-size:16px;margin:0 0 2px}
  .senso .traducao{font-size:12px;font-weight:600;color:var(--tinta-fraca);
    text-transform:uppercase;letter-spacing:.06em;margin:0 0 8px}
  .senso p{font-size:14px;line-height:1.65;margin:0;color:var(--tinta)}

  @media (max-width:760px){
    .abertura{grid-template-columns:1fr;gap:20px}
  }

  /* ---- fluxos de processo ---- */
  .sub-abas{display:flex;gap:4px;border-bottom:1px solid var(--borda);margin-bottom:22px;flex-wrap:wrap}
  .sub-aba{font-family:var(--corpo);font-size:14px;font-weight:600;color:var(--tinta-fraca);
    background:none;border:0;border-bottom:2px solid transparent;padding:11px 16px;
    cursor:pointer;margin-bottom:-1px}
  .sub-aba:hover{color:var(--azul)}
  .sub-aba.ativa{color:var(--azul);border-bottom-color:var(--azul)}
  .sub-aba:focus-visible{outline:2px solid var(--azul);outline-offset:-2px}

  .fluxo{position:relative;padding-left:2px}
  .no{position:relative;padding:0 0 14px 28px;border-left:2px solid var(--borda);margin-left:7px}
  .no:last-child{border-left-color:transparent}
  .no::before{content:"";position:absolute;left:-8px;top:5px;width:14px;height:14px;
    border-radius:50%;background:var(--superficie);border:2px solid var(--azul)}
  .no .caixa{background:var(--superficie);border:1px solid var(--borda);border-radius:11px;
    padding:13px 16px;display:flex;justify-content:space-between;gap:14px;align-items:flex-start;flex-wrap:wrap}
  .no .texto{font-size:14.5px;line-height:1.5;font-weight:500}
  .no .quem{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.04em;
    text-transform:uppercase;color:var(--azul-forte);background:var(--azul-suave);
    border-radius:20px;padding:4px 10px;white-space:nowrap;flex:none}
  .no.motorista .caixa{border-color:#bcd6ef;background:#f7fbff}
  .no.motorista .quem{background:var(--azul);color:#fff}

  .no.marco::before{background:var(--azul);border-color:var(--azul)}
  .no.marco .texto{font-family:var(--display);font-weight:600;font-size:13px;
    letter-spacing:.1em;text-transform:uppercase;color:var(--azul)}
  .no.marco .caixa{border:0;background:none;padding:8px 0}

  .no.decisao::before{border-color:var(--laranja);border-radius:3px;transform:rotate(45deg);top:6px}
  .no.decisao .caixa{border-color:#f0d4b0;background:var(--laranja-suave)}
  .no.decisao .texto{font-weight:600;color:#8a4a05}

  .ramos{display:grid;gap:12px;margin-top:12px}
  .ramo{border-left:2px solid var(--borda);padding-left:16px;margin-left:4px}
  .ramo > .etiqueta{
    display:inline-block;font-family:var(--mono);font-size:10px;font-weight:600;
    letter-spacing:.06em;text-transform:uppercase;border-radius:20px;padding:3px 11px;margin-bottom:10px;
  }
  .ramo.sim > .etiqueta{background:#e7f3fd;color:var(--azul-forte)}
  .ramo.nao > .etiqueta{background:var(--laranja-suave);color:#8a4a05}
  .ramo .no{padding-left:24px}

  .volta{font-size:13px;color:var(--tinta-fraca);font-style:italic;padding:2px 0 10px 28px;margin-left:7px}

  /* ---- treinamentos ---- */
  .treinos{display:grid;grid-template-columns:repeat(auto-fill,minmax(238px,1fr));gap:14px}
  .treino{
    position:relative;text-align:left;font-family:var(--corpo);cursor:pointer;
    background:var(--superficie);border:1px solid var(--borda);border-radius:12px;
    padding:20px;box-shadow:var(--sombra);transition:.16s;
  }
  .treino:hover{transform:translateY(-2px);border-color:var(--azul)}
  .treino:focus-visible{outline:2px solid var(--azul);outline-offset:2px}
  .treino .numero{
    display:flex;align-items:center;justify-content:center;
    width:32px;height:32px;border-radius:9px;margin-bottom:12px;
    font-family:var(--display);font-weight:700;font-size:15px;
    color:#fff;background:var(--azul);
  }
  .treino b{display:block;font-size:15px;font-weight:600;margin-bottom:4px}
  .treino span{font-size:12.5px;color:var(--tinta-fraca);line-height:1.55}

  .voltar{
    display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;
    color:var(--azul);background:none;border:0;padding:0;cursor:pointer;margin-bottom:16px;
    font-family:var(--corpo);
  }
  .voltar:hover{color:var(--azul-forte)}
  .voltar::before{content:"←"}

  .etiquetas{display:flex;flex-wrap:wrap;gap:8px}
  .etiquetas span{
    font-size:13px;font-weight:500;color:var(--tinta);
    background:var(--azul-suave);border:1px solid var(--borda);
    border-radius:20px;padding:6px 13px;
  }

  .excecoes{display:flex;flex-wrap:wrap;gap:8px}
  .excecoes span{
    font-size:13px;font-weight:500;color:#8a4a05;
    background:var(--laranja-suave);border:1px solid #f0d4b0;
    border-radius:20px;padding:6px 13px;
  }

  .servir{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
  .letra{border:1px solid var(--borda);border-radius:12px;padding:18px;text-align:center}
  .letra .inicial{
    font-family:var(--display);font-weight:700;font-size:38px;line-height:1;
    color:var(--laranja);margin-bottom:6px;
  }
  .letra b{display:block;font-size:13px;font-weight:600;letter-spacing:.08em;
    text-transform:uppercase;color:var(--tinta);margin-bottom:10px}
  .letra p{font-size:13px;line-height:1.6;color:var(--tinta-fraca);margin:0}

  .fatores{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
  .fator{
    border-radius:12px;padding:20px 16px;text-align:center;color:#fff;
    background:linear-gradient(150deg, #e07b1f, #c2660f);
  }
  .fator b{display:block;font-size:14px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}

  .tempos{width:100%;border-collapse:collapse;font-size:14px}
  .tempos th{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
    color:var(--tinta-fraca);text-align:left;padding:10px 12px;border-bottom:1px solid var(--borda)}
  .tempos td{padding:12px;border-bottom:1px solid #edf3fa}
  .tempos tr:last-child td{border-bottom:0}
  .tempos .sigla{font-family:var(--mono);font-weight:600;color:var(--azul)}
  .tempos .hora{font-family:var(--mono);font-weight:600;text-align:right;font-size:15px}

  /* ---- formulários ---- */
  .quadro-form{
    background:var(--superficie);border:1px solid var(--borda);border-radius:var(--raio);
    box-shadow:var(--sombra);overflow:hidden;
  }
  .quadro-form iframe{display:block;width:100%;height:78vh;min-height:560px;border:0;background:#fff}

  .abrir-fora{
    display:inline-flex;align-items:center;gap:8px;font-family:var(--corpo);
    font-size:14px;font-weight:600;color:#fff;background:var(--azul);
    border:0;border-radius:10px;padding:12px 20px;text-decoration:none;
    box-shadow:0 6px 16px -6px rgba(43,127,212,.6);transition:.15s;
  }
  .abrir-fora:hover{background:var(--azul-forte)}
  .abrir-fora::after{content:"↗";font-size:13px}
  .abrir-fora.alerta{background:var(--laranja)}
  .abrir-fora.alerta:hover{background:#c2660f}

  .recado-form{
    font-size:13px;line-height:1.6;color:#8a4a05;background:var(--laranja-suave);
    border:1px solid #f0d4b0;border-radius:11px;padding:13px 16px;margin:0 0 16px;
  }

  /* ---- LUPs ---- */
  .lup-cabecalho{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin-bottom:4px}
  .lup-campo .rotulo{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
    color:var(--tinta-fraca);margin-bottom:4px}
  .lup-campo .valor{font-size:14px;font-weight:500;line-height:1.45}
  .lup-objetivo{background:var(--azul-suave);border:1px solid var(--borda);border-radius:11px;
    padding:14px 16px;margin-top:18px;font-size:14.5px;line-height:1.6}
  .lup-objetivo b{display:block;font-size:10px;font-weight:600;letter-spacing:.1em;
    text-transform:uppercase;color:var(--azul-forte);margin-bottom:5px}

  .epis{display:flex;flex-wrap:wrap;gap:12px}
  .epi{display:flex;flex-direction:column;align-items:center;gap:8px;
    border:1px solid var(--borda);border-radius:12px;padding:14px 10px;min-width:104px;flex:1}
  .epi svg{width:32px;height:32px;stroke:var(--azul);fill:none;stroke-width:1.6;
    stroke-linecap:round;stroke-linejoin:round}
  .epi span{font-size:11.5px;font-weight:600;color:var(--tinta-fraca);text-align:center;line-height:1.3}

  .passos-lup{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:16px}
  .passo-lup{border:1px solid var(--borda);border-radius:12px;overflow:hidden;background:var(--superficie)}
  .passo-lup .topo{display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:10px 14px;background:var(--azul-suave);border-bottom:1px solid var(--borda)}
  .passo-lup .n{font-family:var(--mono);font-weight:600;font-size:13px;color:#fff;
    background:var(--azul);border-radius:7px;width:26px;height:26px;
    display:flex;align-items:center;justify-content:center;flex:none}
  .passo-lup .responsavel{font-size:12px;font-weight:600;color:var(--azul-forte)}
  .passo-lup .veredito{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
    border-radius:20px;padding:3px 10px}
  .passo-lup .veredito.certo{background:#e7f6f1;color:#12876a}
  .passo-lup .veredito.errado{background:#fdeceb;color:var(--falha)}
  .passo-lup img{display:block;width:100%;height:190px;object-fit:cover;background:#f2f7fc}
  .vaga-foto{
    height:190px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    background:repeating-linear-gradient(45deg,#f5f9fd,#f5f9fd 10px,#eef4fb 10px,#eef4fb 20px);
    border-bottom:1px dashed var(--borda);color:var(--tinta-fraca);text-align:center;padding:14px;
  }

function desenharNos(nos){
  return nos.map((n) => {
    if (n.t === "volta") return `<p class="volta">${escapar(n.texto)}</p>`;

    if (n.t === "marco")
      return `<div class="no marco"><div class="caixa"><span class="texto">${escapar(n.texto)}</span></div></div>`;

    if (n.t === "decisao")
      return `<div class="no decisao">
                <div class="caixa"><span class="texto">${escapar(n.texto)}</span></div>
                <div class="ramos">${n.ramos.map((r) => `
                  <div class="ramo ${r.tipo}">
                    <span class="etiqueta">${escapar(r.rotulo)}</span>
                    ${desenharNos(r.nos)}
                  </div>`).join("")}</div>
              </div>`;

    return `<div class="no ${n.destaque ? "motorista" : ""}">
              <div class="caixa">
                <span class="texto">${escapar(n.texto)}</span>
                ${n.quem ? `<span class="quem">${escapar(n.quem)}</span>` : ""}
              </div>
            </div>`;
  }).join("");
}

function desenharFluxo(chave){
  const f = FLUXOS[chave];
  return `
    <div class="sub-abas">
      ${Object.keys(FLUXOS).map((k) => `
        <button class="sub-aba ${k === chave ? "ativa" : ""}" data-fluxo="${k}">${escapar(FLUXOS[k].rotulo)}</button>`).join("")}
    </div>
    <div class="cartao">
      <h2>${escapar(f.titulo)}</h2>
      <p style="color:var(--tinta-fraca);font-size:13.5px;margin:-6px 0 18px">${escapar(f.resumo)}</p>
      ${f.blocos.map((b) => `
        ${b.titulo ? `<h2 style="margin-top:26px">${escapar(b.titulo)}</h2>` : ""}
        ${b.nota ? `<p style="color:var(--tinta-fraca);font-size:13px;margin:-8px 0 16px">${escapar(b.nota)}</p>` : ""}
        <div class="fluxo">${desenharNos(b.nos)}</div>`).join("")}
    </div>`;
}

function desenharLup(lup){
  return `
    <div class="sub-abas">
      ${LUPS.map((l) => `
        <button class="sub-aba ${l.id === lup.id ? "ativa" : ""}" data-lup="${l.id}">${escapar(l.titulo)}</button>`).join("")}
    </div>

    <div class="cartao">
      <h2>${lup.n}. ${escapar(lup.titulo)}</h2>
      <div class="lup-cabecalho">
        <div class="lup-campo"><div class="rotulo">Publicação</div><div class="valor">${escapar(lup.data)}</div></div>
        <div class="lup-campo"><div class="rotulo">Elaborador</div><div class="valor">${escapar(lup.elaborador)}</div></div>
        <div class="lup-campo"><div class="rotulo">Supervisor imediato</div><div class="valor">${escapar(lup.supervisor)}</div></div>
        <div class="lup-campo"><div class="rotulo">Áreas</div><div class="valor">${escapar(lup.areas)}</div></div>
        <div class="lup-campo"><div class="rotulo">Padrão</div><div class="valor">${escapar(lup.padrao)}</div></div>
      </div>
      <div class="lup-objetivo"><b>Objetivo</b>${escapar(lup.objetivo)}</div>
    </div>

    <div class="cartao">
      <h2>Equipamentos de proteção individual e coletiva</h2>
      <div class="epis">
        ${EPIS.map((e) => `
          <div class="epi">
            <svg viewBox="0 0 24 24">${e.svg}</svg>
            <span>${escapar(e.nome)}</span>
          </div>`).join("")}
      </div>
    </div>

    <div class="cartao">
      <h2>Passo a passo</h2>
      <div class="passos-lup">
        ${lup.passos.map((p) => `
          <div class="passo-lup">
            <div class="topo">
              <span class="n">${p.n}</span>
              <span class="responsavel">${escapar(p.quem)}</span>
              ${p.ok === undefined ? "" :
                `<span class="veredito ${p.ok ? "certo" : "errado"}">${p.ok ? "Correto" : "Errado"}</span>`}
            </div>
            ${p.img
              ? `<img src="${escapar(p.img)}" alt="${escapar(p.texto)}" loading="lazy">`
              : `<div class="vaga-foto">
                   ${ICONE_FOTO}
                   <b>Foto ainda não enviada</b>
                   <code>./img/lups/${lup.id}-${p.n}.jpg</code>
                 </div>`}
            <div class="legenda">
              ${escapar(p.texto)}
              ${p.itens ? `<ul class="itens">${p.itens.map((i) => `<li>${escapar(i)}</li>`).join("")}</ul>` : ""}
            </div>
          </div>`).join("")}
      </div>
    </div>`;
}

const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = (id) => document.getElementById(id);
let perfil = null;

const escapar = (t) => String(t ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

const todosItens = () => GRUPOS.flatMap((g) =>
  g.itens.map((i) => ({ ...i, risco: !!g.destaque })));

/* ---------- menu ---------- */
function montarMenu(){
  $("menu").innerHTML = GRUPOS.map((g) => `
    <div class="nav-titulo ${g.destaque ? "risco" : ""}">${escapar(g.titulo)}</div>
    ${g.itens.map((i) => `
      <button class="item ${g.destaque ? "risco" : ""}" data-ir="${i.id}">
        <span class="ponto"></span>${escapar(i.rotulo)}
      </button>`).join("")}
  `).join("");

  document.querySelectorAll("[data-ir]").forEach((b) =>
    b.addEventListener("click", () => abrir(b.dataset.ir)));
}

function marcar(id){
  document.querySelectorAll("[data-ir]").forEach((b) =>
    b.classList.toggle("ativo", b.dataset.ir === id));
}

/* ---------- conteúdo ---------- */
function abrir(id){
  if (id === "inicio") return verInicio();

  const item = todosItens().find((s) => s.id === id);
  if (!item) return verInicio();
  if (item.link){ window.location.href = item.link; return; }

  marcar(id);
  history.replaceState(null, "", "#" + id);

  if (item.lups){
    const desenhar = (idLup) => {
      const lup = LUPS.find((l) => l.id === idLup) ?? LUPS[0];
      $("conteudo").innerHTML = `
        <h1>${escapar(item.rotulo)}</h1>
        <p class="sub">${escapar(item.resumo || "")}</p>
        ${desenharLup(lup)}`;
      $("conteudo").querySelectorAll("[data-lup]").forEach((b) =>
        b.addEventListener("click", () => desenhar(b.dataset.lup)));
      window.scrollTo({ top: 0 });
    };
    desenhar(LUPS[0].id);
    return;
  }

  if (item.form){
    const embutir = !item.semEmbutir;
    const url = item.form.includes("?")
      ? item.form + "&embedded=true"
      : item.form + "?embedded=true";

    $("conteudo").innerHTML = `
      <h1>${escapar(item.rotulo)}</h1>
      <p class="sub">${escapar(item.resumo || "")}</p>
      ${item.aviso ? `<p class="recado-form">${escapar(item.aviso)}</p>` : ""}
      <div class="cartao">
        <p>${escapar(item.intro || "")}</p>
        <p style="margin-top:16px">
          <a class="abrir-fora ${item.aviso ? "alerta" : ""}"
             href="${escapar(item.form)}" target="_blank" rel="noopener">Abrir formulário</a>
        </p>
      </div>
      ${embutir ? `<div class="quadro-form">
        <iframe src="${escapar(url)}" title="${escapar(item.rotulo)}"
                loading="lazy">Carregando o formulário…</iframe>
      </div>` : ""}`;

    window.scrollTo({ top: 0 });
    return;
  }

  if (item.treinos){
    const lista = () => {
      $("conteudo").innerHTML = `
        <h1>${escapar(item.rotulo)}</h1>
        <p class="sub">${escapar(item.resumo || "")}</p>
        ${desenharTreinamentos()}`;
      $("conteudo").querySelectorAll("[data-treino]").forEach((b) =>
        b.addEventListener("click", () => detalhe(b.dataset.treino)));
      window.scrollTo({ top: 0 });
    };

    const detalhe = (idTreino) => {
      const t = TREINAMENTOS.find((x) => x.id === idTreino);
      if (!t) return lista();
      $("conteudo").innerHTML = `
        <button class="voltar" id="voltar-treinos">Todos os treinamentos</button>
        <h1>${t.n}. ${escapar(t.titulo)}</h1>
        <p class="sub">${escapar(t.resumo)}</p>
        ${t.html ?? ""}
        ${t.nos ? `<div class="cartao"><h2>Fluxo</h2><div class="fluxo">${desenharNos(t.nos)}</div></div>` : ""}`;
      $("voltar-treinos").addEventListener("click", lista);
      window.scrollTo({ top: 0 });
    };

    lista();
    return;
  }

  if (item.fluxo){
    const desenhar = (chave) => {
      $("conteudo").innerHTML = `
        <h1>${escapar(item.rotulo)}</h1>
        <p class="sub">${escapar(item.resumo || "")}</p>
        ${desenharFluxo(chave)}`;
      $("conteudo").querySelectorAll("[data-fluxo]").forEach((b) =>
        b.addEventListener("click", () => desenhar(b.dataset.fluxo)));
      window.scrollTo({ top: 0 });
    };
    desenhar("pre-rota");
    return;
  }

  $("conteudo").innerHTML = `
    <h1>${escapar(item.id === "sonho" ? "Sonho da revenda" : item.rotulo)}</h1>
    <p class="sub">${escapar(item.resumo || "")}</p>
    ${item.html ?? `
      <div class="cartao">
        <span class="em-breve">Em preparação</span>
        <h2>Conteúdo ainda não publicado</h2>
        <p>Esta seção já aparece no menu, mas o conteúdo ainda vai ser cadastrado.</p>
      </div>`}`;

  window.scrollTo({ top: 0 });
}

function verInicio(){
  marcar("inicio");
  history.replaceState(null, "", location.pathname);

  const hora = new Date().getHours();
  const saudacao = hora < 12 ? "Bom dia" : hora < 18 ? "Boa tarde" : "Boa noite";

  $("conteudo").innerHTML = `
    <div class="cartao capa">
      <h1>${saudacao}, ${escapar(perfil.nome.split(" ")[0])}</h1>
      <p class="sub">Escolha uma área no menu ao lado ou nos atalhos abaixo.</p>
    </div>
    ${GRUPOS.map((g) => `
      <h2 class="titulo-secao">${escapar(g.titulo)}</h2>
      <div class="atalhos">
        ${g.itens.map((i) => `
          <button class="atalho ${g.destaque ? "risco" : ""}" data-atalho="${i.id}">
            <b>${escapar(i.rotulo)}</b>
            <span>${escapar(i.resumo || "")}</span>
          </button>`).join("")}
      </div>`).join("")}`;

  $("conteudo").querySelectorAll("[data-atalho]").forEach((b) =>
    b.addEventListener("click", () => abrir(b.dataset.atalho)));
}

$("sair").addEventListener("click", async () => {
  await sb.auth.signOut();
  window.location.replace(TELA_LOGIN);
});

/* ---------- entrada ---------- */
(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (!session){ window.location.replace(TELA_LOGIN); return; }

  const { data } = await sb.from("perfis")
    .select("nome, setor, papel, ativo, senha_provisoria")
    .eq("id", session.user.id).maybeSingle();

  if (!data || !data.ativo){ await sb.auth.signOut(); window.location.replace(TELA_LOGIN); return; }
  if (data.senha_provisoria){ window.location.replace(TELA_LOGIN); return; }

  perfil = data;
  $("quem").textContent = perfil.nome.split(" ")[0];
  $("cargo").textContent = perfil.setor || "Tarumã";
  if (perfil.papel === "admin") $("link-admin").hidden = false;

  montarMenu();

  const alvo = location.hash.replace("#", "");
  if (alvo && todosItens().some((s) => s.id === alvo)) abrir(alvo);
  else verInicio();
})();

/* ---------------- menu retrátil ---------------- */
(() => {
  const corpo = document.body;
  const noCelular = () => window.matchMedia("(max-width:860px)").matches;

  function alternar(){
    if (noCelular()) corpo.classList.toggle("menu-aberto");
    else corpo.classList.toggle("menu-oculto");
    const aberto = noCelular() ? corpo.classList.contains("menu-aberto")
                               : !corpo.classList.contains("menu-oculto");
    document.getElementById("alternar-menu").setAttribute("aria-expanded", String(aberto));
  }

  const fechar = () => corpo.classList.remove("menu-aberto");

  document.getElementById("alternar-menu").addEventListener("click", alternar);
  document.getElementById("recolher-menu").addEventListener("click", alternar);
  document.getElementById("cortina").addEventListener("click", fechar);

  // no celular, escolher um item fecha a gaveta
  document.querySelector(".lateral").addEventListener("click", (e) => {
    if (noCelular() && e.target.closest("button, a")
        && !e.target.closest("#recolher-menu")) fechar();
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") fechar();
  });

  // ao girar a tela ou redimensionar, volta ao estado padrão de cada formato
  window.addEventListener("resize", () => {
    if (!noCelular()) corpo.classList.remove("menu-aberto");
  });
})();
</script>
